# Defines run jobs
#
# TIGER, FRASER, FT_EBEY are nested regions 
# and must be below PNW
#

# UW Atmos Lab 4km WRF (experimental - branch: uw-atmos-wrf-input)
# Uncomment once download_uw_wrfout.sh URL/format is confirmed with UW.
# UW only publishes 0z and 12z; 6z/18z lines are intentionally omitted.
####################
#0z-UWPNW
#12z-UWPNW

# HRRR 3km WA-only domain (experimental - branch: uw-atmos-wrf-input)
# Uses NOAA NOMADS HRRR GRIB2 directly; 0z and 18z extended (48h) runs.
# Uncomment to enable once WAHRRR domain static files are validated.
####################
0z-WAHRRR
0z-WAHRRR+1
18z-WAHRRR

# 00z
####################
0z-PNW
0z-PNW-WINDOW
0z-TIGER-WINDOW
0z-FRASER-WINDOW
0z-FT_EBEY-WINDOW
0z-PNWRAT

# 06z
####################
6z-PNW
6z-PNW-WINDOW
6z-TIGER-WINDOW
6z-FRASER-WINDOW
6z-PNWRAT

# 12z
####################
12z-PNW
12z-PNW-WINDOW
12z-TIGER-WINDOW
12z-FRASER-WINDOW
12z-PNWRAT

# 18z
####################
18z-PNW
18z-PNW-WINDOW
18z-TIGER-WINDOW
18z-FRASER-WINDOW
